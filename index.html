<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of the Lantern - MyAnimeWorld.com</title>
    <meta name="description" content="A peaceful haven management RPG where reincarnated souls find their way home">
    <link rel="stylesheet" href="src/assets/css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <h1>🏮 Echoes of the Lantern</h1>
            <p class="subtitle">A Haven for Wandering Souls</p>
        </header>

        <!-- Main Game Area -->
        <main class="game-main">
            <!-- Haven Info Panel -->
            <section class="panel haven-panel">
                <h2>🏡 Your Haven</h2>
                <div class="haven-stats">
                    <div class="stat">
                        <span class="stat-label">Gold:</span>
                        <span class="stat-value" id="gold">100</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Day:</span>
                        <span class="stat-value" id="day">1</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Heroes:</span>
                        <span class="stat-value" id="hero-count">0</span>
                    </div>
                </div>
            </section>

            <!-- Heroes Panel -->
            <section class="panel heroes-panel">
                <h2>✨ Your Heroes</h2>
                <div id="heroes-list" class="heroes-list">
                    <p class="empty-message">No heroes yet. Summon your first hero!</p>
                </div>
                <button class="btn btn-primary" id="summon-btn">Summon Hero (50 Gold)</button>
            </section>

            <!-- Activity Log -->
            <section class="panel log-panel">
                <h2>📜 Activity Log</h2>
                <div id="activity-log" class="activity-log">
                    <p class="log-entry">Welcome to Echoes of the Lantern! Your haven awaits...</p>
                </div>
            </section>
        </main>

        <!-- Footer Controls -->
        <footer class="game-footer">
            <button class="btn" id="save-btn">💾 Save Game</button>
            <button class="btn" id="load-btn">📂 Load Game</button>
            <button class="btn" id="reset-btn">🔄 Reset</button>
        </footer>
    </div>

    <!-- Load Scripts -->
    <script type="module" src="src/core/gameState.js"></script>
    <script type="module" src="src/core/game.js"></script>
</body>
</html>
